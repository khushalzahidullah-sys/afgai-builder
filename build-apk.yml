name: AfgAI Builder - Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check Project
        run: |
          echo "Checking Android project..."
          ls -la
          echo "Searching for Gradle wrapper..."
          find . -maxdepth 3 -name "gradlew" -print

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew was not found."
            echo "The generated Android project must contain a Gradle wrapper."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AfgAI-Builder-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
