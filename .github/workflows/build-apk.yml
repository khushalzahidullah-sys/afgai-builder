name: AfgAI Builder - Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check Project
        run: |
          echo "Checking Android project..."
          ls -la
          find . -maxdepth 4 -name "gradlew" -print

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew was not found."
            exit 1
          fi

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" release/AfgAI-Builder.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="afgai-build-${{ github.run_number }}"

          gh release create "$TAG" \
            release/AfgAI-Builder.apk \
            --title "AfgAI Builder APK ${{ github.run_number }}" \
            --notes "APK generated automatically by AfgAI Builder."

      - name: Build Complete
        run: |
          echo "================================="
          echo "AfgAI Builder APK BUILD COMPLETE"
          echo "================================="
